# Preprocessing configuration for the dataset preparation pipeline.
# Loaded by default by prepare_dataset.py.
# Precedence in Python: CLI arguments > this YAML > code defaults.
# Make can convert Make/environment variables into CLI arguments before launching Python.
#
# dataset_root, source_name, and target_name must be set before use.

dataset_root: /path/to/dataset
source_name: source.tif
target_name: target.tif

image_size: [256, 256]
grid_movement: [256, 256]
margin: 200
seed: null
save_masks: false

train_ratio: 0.8
val_ratio: 0.05
test_ratio: 0.15

min_foreground_ratio: 0.25
max_white_ratio: 0.7
white_threshold: 250
max_largest_white_component_ratio: 0.20
