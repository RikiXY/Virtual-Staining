# Paired baseline: stained -> label_free on the existing inv_256 split.
dataset_root: local_workspace/datasets/inv_256
results_path: local_workspace/results
run_name: inv_256_pix2pix_30ep
image_size: [256, 256]

method:
  # Translation/training algorithm: one G, one conditional D, paired supervision.
  name: pix2pix

data:
  pairing: paired

model:
  # Network-component blueprints instantiated by the selected method.
  inputs: [stained]
  target: label_free
  generator:
    architecture: concat_unet
    base_channels: 64
    norm: batch
    dropout: true
    bilinear: false
  discriminator:
    architecture: patchgan
    ndf: 64
    norm: instance
    use_sigmoid: false

training:
  batch_size: 8
  epochs: 30
  lr_g: 0.0002
  lr_d: 0.0002
  beta1: 0.5
  beta2: 0.999
  seed: 42
  num_workers: 4
  validate_rate: 5
  checkpoint_rate: 5
  checkpoint_top_k: 3
  log_rate: 25
  scheduler:
    name: linear_decay
    decay_start_epoch: 15
  augmentation:
    enabled: false
    expansion_factor: 1
    intensity: light
  losses:
    generator:
      - name: adversarial_bce
        weight: 1.0
      - name: l1
        weight: 28.0
    discriminator:
      - name: adversarial_bce
        weight: 1.0

inference:
  checkpoint_policy: best
  checkpoint_metric: loss_G_val

evaluation:
  # The inv_256 test manifest contains aligned stained/label-free references.
  protocol: paired
  save_graphs: true
  bootstrap_iterations: 1000
  bootstrap_seed: 42
