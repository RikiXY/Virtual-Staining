# Minimal prepare configuration; illustrative settings, not study recommendations.
# vs config check --config config/runs/minimal_prepare.yaml --stages prepare
# vs config resolve --config config/runs/minimal_prepare.yaml --stages prepare
# Configuration-only inspection needs no assets. Execution needs the selected stage inputs.
# See example.yaml for all options and path bases; stages are not run-YAML keys.
dataset_root: local_workspace/datasets/your_sample
preprocessing:
  inputs:
    inventory: inputs/slide_sets.csv
    modalities: [AF, LF]
    reference: LF
    target_modalities: [HE]
  split:
    unit: patient
    train: 0.8
    val: 0.1
    test: 0.1
    seed: 42
