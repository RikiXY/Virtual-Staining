# One YAML file drives one experiment run.

dataset_root: local_workspace/datasets/your_sample
results_path: local_workspace/results
run_name: your_run_name

preprocessing:
  source_name: source.tif
  target_name: target.tif
  image_size: [256, 256]
  grid_movement: [256, 256]
  margin: 200
  seed: null
  save_masks: false
  train_ratio: 0.8
  val_ratio: 0.05
  test_ratio: 0.15
  min_foreground_ratio: 0.25
  max_white_ratio: 0.7
  white_threshold: 250
  max_largest_white_component_ratio: 0.20

training:
  image_size: [256, 256]
  batch_size: 8
  epochs: 100
  lr_g: 0.0002
  lr_d: 0.0002
  beta1: 0.5
  beta2: 0.999
  l1_weight: 25.0
  seed: null
  num_workers: 4
  validate_rate: 10
  checkpoint_rate: 10
  log_rate: 15
  resume: null

inference:
  checkpoint: local_workspace/results/your_run_name/checkpoints/ep099.pth
  image_size: [256, 256]

evaluation:
  target_dir: local_workspace/datasets/your_sample/dataset_test
  generated_dir: local_workspace/results/your_run_name/output_test
  output_dir: local_workspace/results/your_run_name/evaluation
  save_graphs: true
