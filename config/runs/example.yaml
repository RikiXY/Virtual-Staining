# Copy this file for a new experiment, then edit the values in one place.
# Run with: make <target> CONFIG=config/runs/local/my_run.yaml

# Dataset folder containing the paired full-size input images named below.
dataset_root: local_workspace/datasets/your_sample
# Optional: override the default manifest path
# (defaults to dataset_root/manifests/manifest.csv).
# manifest_path: local_workspace/datasets/your_sample/manifests/manifest.csv

# All training, inference, and evaluation artifacts are grouped by run_name here.
results_path: local_workspace/results
run_name: example_run

# One size drives both patch extraction and model resize for the standard workflow.
# Convention: [width, height] - e.g. [320, 256] means 320 px wide, 256 px tall.
image_size: [256, 256]

model:
  generator:
    in_channels: 3
    out_channels: 3
    base_channels: 64
    norm: batch
    dropout: false
    bilinear: false
  discriminator:
    in_channels: 6
    ndf: 64
    norm: instance
    # Must stay false when using adversarial_bce loss terms.
    # BCE-with-logits applies sigmoid internally.
    use_sigmoid: false

preprocessing:
  inputs:
    inventory: inputs/pairs.csv
    source_modality: autofluorescence
    target_modality: H&E
    hash_verification: cached  # use always for publication verification
  patching:
    patch_size: [256, 256]
    grid_movement: [256, 256]
    margin: 200
    save_discarded_patches: false
  masks:
    provided_layout: auto
    generation: if_missing
    strategy: connected_components
    source_strategy: connected_components
    target_strategy: hsv
    scale: 0.25
    lowres_filtering: true
    save_resolved_masks: false
    save_patch_masks: false
  alignment:
    mode: auto
    method: affine_sift
    validate_declared: true
    on_failure: error
  filtering:
    foreground:
      enabled: true
      policy: both
      min_ratio: 0.25
    max_white_ratio: 0.70
    white_threshold: 250
    max_largest_white_component_ratio: 0.20
  split:
    unit: patient
    train: 0.80
    val: 0.10
    test: 0.10
    seed: 42
  io:
    tiled: true
    backend: auto
    max_memory_gb: 8.0

training:
  batch_size: 8
  epochs: 100

  lr_g: 0.0002
  lr_d: 0.0002
  beta1: 0.5
  beta2: 0.999

  seed: 42
  num_workers: 4

  validate_rate: 10
  checkpoint_rate: 10
  # Number of ranked validation checkpoint candidates to retain in checkpoints/best.json.
  checkpoint_top_k: 3
  log_rate: 15
  resume: null
  # Optional optimizer learning-rate scheduler. Use name: none, linear_decay,
  # or reduce_on_plateau. Epoch numbers are zero-based.
  scheduler:
    name: none
    # Linear decay example:
    # name: linear_decay
    # decay_start_epoch: 50
    # Plateau example:
    # name: reduce_on_plateau
    # monitor: val_ssim
    # mode: max
    # factor: 0.5
    # patience: 5
    # min_lr: 0.00002
  # Optional early stopping based on validation CSV columns.
  # early_stopping:
  #   monitor: val_ssim
  #   mode: max
  #   patience: 15
  #   min_delta: 0.0

  augmentation:
    # Training-only on-the-fly augmentation. No transformed patches are saved.
    enabled: false
    # Effective train epoch length is multiplied by this factor when enabled.
    expansion_factor: 1
    # Supported values: light, medium, strong.
    intensity: light

  losses:
    generator:
      - name: adversarial_bce
        weight: 1.0
      - name: l1
        weight: 25.0
      # Optional SSIM term. Leave disabled or set a nonzero weight intentionally.
      - name: ssim
        weight: 0.0
        enabled: false
        params:
          data_range: 1.0
          window_size: 11
          sigma: 1.5
          channel_mode: rgb
          reduction: mean
          mask:
            enabled: false
            source: foreground_mask
            foreground_weight: 1.0
            background_weight: 0.25
            ignore_empty_mask: true
        schedule:
          type: constant
    discriminator:
      - name: adversarial_bce
        weight: 1.0

inference:
  # Supported policies:
  # - latest: newest ep*.pth file in results_path/run_name/checkpoints
  # - best: rank-1 checkpoint from checkpoints/best.json for checkpoint_metric
  # - top_k: ranked checkpoint from checkpoints/best.json using checkpoint_rank
  checkpoint_policy: best
  # Required for checkpoint_policy: best/top_k.
  checkpoint_metric: val_ssim
  # Optional for checkpoint_policy: top_k. Defaults to 1.
  # checkpoint_rank: 1
  # Or choose a checkpoint explicitly. Relative paths are resolved from
  # the run root (results_path/run_name/).
  # checkpoint_path: checkpoints/ep099.pth

  # Output directory override. By default inference writes under the run artifacts tree.
  # output_dir: local_workspace/results/example_run/artifacts/output_test

evaluation:
  # Evaluation targets come from test manifest records under project.dataset_root.
  # Optional evaluation directory overrides. Defaults:
  # generated_dir: local_workspace/results/example_run/artifacts/output_test
  # output_dir: local_workspace/results/example_run/evaluation
  save_graphs: true
  # hide_graphs_path: false
