name: inv_256_methods_30ep
continue_on_failure: false

jobs:
  - config_path: ../../runs/local/inv_256_pix2pix_30ep.yaml
    label: Pix2Pix paired baseline, 30 epochs
    stages: [train, infer, evaluate]
