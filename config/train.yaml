# Training configuration for the Pix2Pix model.
# Loaded by default by pix2pix.py train.
# Precedence in Python: CLI arguments > this YAML > code defaults.
# Make can convert Make/environment variables into CLI arguments before launching Python.
#
# dataset_root, run_name, and epochs must be set before use.

dataset_root: /path/to/dataset
results_path: local_workspace/results
run_name: my_run
epochs: 100

image_size: [256, 256]
batch_size: 8

lr_g: 0.0002
lr_d: 0.0002
beta1: 0.5
beta2: 0.999
l1_weight: 25.0

seed: null
num_workers: 4
validate_rate: 10
checkpoint_rate: 10
log_rate: 15
resume: null
