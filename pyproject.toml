[project]
name = "virtual-staining"
version = "0.1.0"
description = "Paired virtual staining pipeline for histopathology images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib==3.10.8",
    "numpy==2.4.3",
    "opencv-python-headless==4.13.0.92",
    "pandas==3.0.2",
    "pillow==12.1.1",
    "scikit-image==0.26.0",
    "scipy==1.17.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils", "virtual_staining"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
