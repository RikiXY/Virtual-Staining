[project]
name = "virtual-staining"
version = "0.1.0"
description = "Paired virtual staining pipeline for histopathology images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "albumentations>=2.0",
    "matplotlib>=3.7",
    "numpy>=2.0",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
    "pillow>=12.2.0",
    "pyyaml>=6.0",
    "scikit-image>=0.24",
    "scipy>=1.11",
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.scripts]
vs-prepare = "virtual_staining.cli.prepare_dataset:main"
vs-complete-run = "virtual_staining.cli.complete_run:main"
vs-run-queue = "virtual_staining.cli.run_queue:main"
vs-train = "virtual_staining.cli.train:main"
vs-infer = "virtual_staining.cli.infer:main"
vs-infer-images = "virtual_staining.cli.infer_images:main"
vs-evaluate = "virtual_staining.cli.evaluate:main"
vs-compare = "virtual_staining.cli.compare:main"
vs-evaluate-single = "virtual_staining.cli.evaluate_single:main"
vs-render-panels = "virtual_staining.cli.render_panels:main"
vs-organize = "virtual_staining.cli.organize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["virtual_staining"]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["virtual_staining", "tests"]
exclude = [
    "**/.*",
    "**/__pycache__",
    "**/node_modules",
    "docs/notebooks",
]
reportPrivateImportUsage = false
useLibraryCodeForTypes = false

[tool.uv]
