[project]
name = "virtual-staining"
version = "0.1.0"
description = "Paired virtual staining pipeline for histopathology images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=2.0",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scikit-image>=0.24",
    "scipy>=1.11",
    "torch>=2.0",
    "torchvision>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["virtual_staining"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
extend-exclude = ["docs/notebooks"]

[tool.pyright]
include = ["virtual_staining", "tests", "src", "tools"]
exclude = [
    "**/.*",
    "**/__pycache__",
    "**/node_modules",
    "docs/notebooks",
]
reportPrivateImportUsage = false
useLibraryCodeForTypes = false

[tool.uv]
